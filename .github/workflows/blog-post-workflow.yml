name: Latest blog posts

on:
  push:
    branches: [main]
    paths: [".github/workflows/blog-post-workflow.yml", "scripts/update_posts.py"]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_posts.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then echo "No changes"; exit 0; fi
          git config user.name "blog-post-bot"
          git config user.email "blog-post-bot@users.noreply.github.com"
          git commit -am "Update latest blog posts"
          git push
