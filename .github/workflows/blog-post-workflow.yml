name: Latest blog posts

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/elizabethfuentes12"
          max_post_count: 5
          template: "- [$title]($url) ($date)"
          date_format: "mmm d, yyyy"
